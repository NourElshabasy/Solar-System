<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <style>
      body {
        background-color: #000000;
        color: white;
        font-family: Arial;
        text-align: center;
      }

      h1 {
        color: #ffd166;
      }

      .solar-system {
        align-items: center;
        display: flex;
        gap: 40px;
        justify-content: center;
        margin: 40px auto;
        max-width: 1100px;
      }

      .sun {
        flex-shrink: 0;
        width: 300px;
      }

      .sun-image {
        display: block;
        width: 100%;
      }

      .planets {
        align-content: center;
        display: flex;
        flex: 1;
        flex-wrap: nowrap;
        gap: 4px;
        justify-content: flex-start;
        max-width: 800px;
        overflow-x: auto;
        padding: 10px 0;
      }

      .planet {
        align-items: center;
        display: flex;
        justify-content: center;
      }

      .planet a {
        display: block;
      }

      .planet-image {
        display: block;
        object-fit: contain;
      }

      .mercury .planet-image {
        height: 84px;
        width: 84px;
      }

      .venus .planet-image {
        height: 112px;
        width: 112px;
      }

      .earth .planet-image {
        height: 121px;
        width: 121px;
      }

      .mars .planet-image {
        height: 95px;
        width: 95px;
      }

      .jupiter .planet-image {
        height: 245px;
        width: 245px;
      }

      .saturn .planet-image {
        height: 216px;
        width: 272px;
      }

      .uranus .planet-image,
      .neptune .planet-image {
        height: 150px;
        width: 150px;
      }
    </style>
  </head>
  <body>
    <h1>Our Solar System</h1>
    <p>The solar system is made up of the Sun and the objects that orbit it.</p>

    <h2>Planets</h2>
    <div class="solar-system">
      <div class="sun">
        <img class="sun-image" src="images/sun.png" alt="The Sun" />
      </div>

      <div class="planets">
        <div class="planet mercury">
          <a href="mercury.html">
            <img class="planet-image" src="images/mercury.png" alt="Mercury" />
          </a>
        </div>
        <div class="planet venus">
          <a href="venus.html">
            <img class="planet-image" src="images/venus.png" alt="Venus" />
          </a>
        </div>
        <div class="planet earth">
          <a href="earth.html">
            <img class="planet-image" src="images/earth.png" alt="Earth" />
          </a>
        </div>
        <div class="planet mars">
          <a href="mars.html">
            <img class="planet-image" src="images/mars.png" alt="Mars" />
          </a>
        </div>
        <div class="planet jupiter">
          <a href="jupiter.html">
            <img class="planet-image" src="images/jupiter.png" alt="Jupiter" />
          </a>
        </div>
        <div class="planet saturn">
          <a href="saturn.html">
            <img class="planet-image" src="images/saturn.png" alt="Saturn" />
          </a>
        </div>
        <div class="planet uranus">
          <a href="uranus.html">
            <img class="planet-image" src="images/uranus.png" alt="Uranus" />
          </a>
        </div>
        <div class="planet neptune">
          <a href="neptune.html">
            <img class="planet-image" src="images/neptune.png" alt="Neptune" />
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
