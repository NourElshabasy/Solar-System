<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar System</title>
    <style>
      body {
        background-color: #000000;
        color: white;
        font-family: Arial;
        text-align: center;
      }

      h1 {
        color: #ffd166;
      }

      #fun-fact-button {
        background-color: #ffd166;
        border: 0;
        border-radius: 4px;
        color: #000000;
        cursor: pointer;
        font-size: 1rem;
        padding: 10px 16px;
      }

      #fun-fact-button:hover {
        background-color: #ffe29a;
      }

      #fun-fact {
        color: #ffd166;
        min-height: 24px;
      }

      .solar-system {
        align-items: center;
        display: flex;
        gap: 40px;
        justify-content: center;
        margin: 40px auto;
        max-width: 1400px;
      }

      .sun {
        flex-shrink: 0;
        width: 380px;
      }

      .sun-image {
        display: block;
        width: 100%;
      }

      .planets {
        align-items: center;
        display: flex;
        flex-wrap: nowrap;
        gap: 12px;
        min-width: 0;
      }

      .planet {
        align-items: center;
        display: flex;
        flex: 0 0 auto;
        justify-content: center;
        flex-direction: column;
      }

      .planet-image {
        object-fit: contain;
      }

      .mercury .planet-image {
        height: 57px;
        width: 57px;
      }

      .venus .planet-image {
        height: 77px;
        width: 77px;
      }

      .earth .planet-image {
        height: 83px;
        width: 83px;
      }

      .mars .planet-image {
        height: 66px;
        width: 66px;
      }

      .jupiter .planet-image {
        height: 168px;
        width: 168px;
      }

      .saturn .planet-image {
        height: 172px;
        width: 217px;
      }

      .uranus .planet-image,
      .neptune .planet-image {
        height: 104px;
        width: 104px;
      }
    </style>
  </head>
  <body>
    <h1>Our Solar System</h1>
    <p>The solar system is made up of the Sun and the objects that orbit it.</p>
    <p>Click on a planet to explore it.</p>

    <button id="fun-fact-button">Show a random fun fact</button>
    <p id="fun-fact"></p>

    <h2>Planets</h2>
    <div class="solar-system">
      <div class="sun">
        <p>The Sun</p>
        <a href="pages/sun.html">
          <img class="sun-image" src="images/sun.png" alt="The Sun" />
        </a>
      </div>

      <div class="planets">
        <div class="planet mercury">
          <p>Mercury</p>
          <a href="pages/planets/mercury.html">
            <img class="planet-image" src="images/mercury.png" alt="Mercury" />
          </a>
        </div>
        <div class="planet venus">
          <p>Venus</p>
          <a href="pages/planets/venus.html">
            <img class="planet-image" src="images/venus.png" alt="Venus" />
          </a>
        </div>
        <div class="planet earth">
          <p>Earth</p>
          <a href="pages/planets/earth.html">
            <img class="planet-image" src="images/earth.png" alt="Earth" />
          </a>
        </div>
        <div class="planet mars">
          <p>Mars</p>
          <a href="pages/planets/mars.html">
            <img class="planet-image" src="images/mars.png" alt="Mars" />
          </a>
        </div>
        <div class="planet jupiter">
          <p>Jupiter</p>
          <a href="pages/planets/jupiter.html">
            <img class="planet-image" src="images/jupiter.png" alt="Jupiter" />
          </a>
        </div>
        <div class="planet saturn">
          <p>Saturn</p>
          <a href="pages/planets/saturn.html">
            <img class="planet-image" src="images/saturn.png" alt="Saturn" />
          </a>
        </div>
        <div class="planet uranus">
          <p>Uranus</p>
          <a href="pages/planets/uranus.html">
            <img class="planet-image" src="images/uranus.png" alt="Uranus" />
          </a>
        </div>
        <div class="planet neptune">
          <p>Neptune</p>
          <a href="pages/planets/neptune.html">
            <img class="planet-image" src="images/neptune.png" alt="Neptune" />
          </a>
        </div>
      </div>
    </div>

    <script>
      const funFacts = [
        "A day on Venus is longer than a year on Venus.",
        "Jupiter is the largest planet in our solar system.",
        "Saturn's rings are made mostly of ice and rock.",
        "Mars has the largest volcano in the solar system.",
        "Neptune has the fastest winds of any planet in the solar system.",
      ];

      function showRandomFunFact() {
        const randomIndex = Math.floor(Math.random() * funFacts.length);
        document.getElementById("fun-fact").textContent = funFacts[randomIndex];
      }

      document
        .getElementById("fun-fact-button")
        .addEventListener("click", showRandomFunFact);
    </script>
  </body>
</html>
